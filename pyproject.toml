[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter"
version = "0.1.0"
description = "Tenant-first LLM control plane"
requires-python = ">=3.13,<3.14"
dependencies = [
  "anyio==4.15.1",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.1.1",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "PyJWT==2.15.0",
  "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9", "mypy==2.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "migrations"]
